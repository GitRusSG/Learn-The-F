<style>

.container { max-width: 800px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 30px; color: #64ffda; font-size: 2.5em; text-transform: uppercase; letter-spacing: 6px; text-shadow: 0 0 20px rgba(100,255,218,0.4), 0 0 60px rgba(100,255,218,0.1); font-family: 'Orbitron', monospace; }
.quiz-select { display: block; margin-bottom: 30px; max-height: 70vh; overflow-y: auto; padding: 10px; }
.folder { margin-bottom: 20px; }
.folder-title { color: #64ffda; font-size: 1.2em; margin-bottom: 10px; padding: 14px 18px; border-bottom: 1px solid rgba(100,255,218,0.15); cursor: pointer; font-family: 'Orbitron', monospace; font-weight: 700; font-size: 0.85em; letter-spacing: 2px; transition: all 0.3s; border-left: 3px solid transparent; text-transform: uppercase; }
.folder-title:hover { background: rgba(100,255,218,0.05); border-radius: 8px; border-left: 3px solid #64ffda; box-shadow: inset 0 0 30px rgba(100,255,218,0.03); }
.folder-content { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px; max-height: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease; opacity: 0; padding-top: 0; padding-bottom: 0; }
.folder-content.open { max-height: 2000px; opacity: 1; padding-top: 10px; padding-bottom: 10px; }
.quiz-btn { padding: 18px; background: rgba(10,20,40,0.8); border: 1px solid rgba(100,255,218,0.12); border-radius: 12px; cursor: pointer; transition: all 0.3s; color: #aaa; font-size: 0.95em; text-align: left; font-family: 'Rajdhani', sans-serif; font-weight: 500; backdrop-filter: blur(5px); position: relative; overflow: hidden; }
.quiz-btn::before { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg,transparent,rgba(100,255,218,0.05),transparent); transition:left 0.5s; }
.quiz-btn:hover::before { left:100%; }
.quiz-btn:hover { border-color: #64ffda; transform: translateY(-2px); box-shadow: 0 4px 25px rgba(100,255,218,0.12), inset 0 0 20px rgba(100,255,218,0.02); color: #fff; }
.quiz-btn.active { border-color: #64ffda; background: #0f3460; }
.unit-btn { background:rgba(10,30,60,0.7);color:#777;border:1px solid rgba(100,255,218,0.15);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:0.8em;transition:all 0.2s;font-family:'Rajdhani',sans-serif; }
.unit-btn:hover { color:#64ffda;border-color:#64ffda;box-shadow:0 0 10px rgba(100,255,218,0.2); }
.quiz-area { display: none; }
.quiz-area.show { display: block; }
.question { background: rgba(10,20,40,0.7); border-radius: 14px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(100,255,218,0.08); backdrop-filter: blur(10px); transition: all 0.3s; }

.question h3 { color: #64ffda; margin-bottom: 12px; font-size: 1.1em; font-family: 'Orbitron', monospace; font-weight: 400; font-size: 0.8em; letter-spacing: 2px; text-transform: uppercase; }

<body>
<div id="splashScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;cursor:pointer;" onclick="document.getElementById('splashScreen').style.display='none';startLoading();">
  <div style="font-family:'Orbitron',monospace;color:#64ffda;font-size:2em;letter-spacing:6px;text-shadow:0 0 20px rgba(100,255,218,0.4);margin-bottom:20px;">LEARN TF</div>
  <div style="font-family:'Rajdhani',sans-serif;color:rgba(200,200,200,0.5);font-size:1.1em;animation:pulse 2s infinite;">[ CLICK ANYWHERE TO START ]</div>
  <style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}</style>
</div>
<div id="loadingScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.8s;display:none;">

  <canvas id="particleCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;">
    <div style="font-size:0.7em;color:rgba(100,255,218,0.4);font-family:'Orbitron',monospace;letter-spacing:6px;margin-bottom:10px;text-transform:uppercase;">// INITIALIZING</div>
    <h1 style="color:#64ffda;font-size:3em;font-family:'Orbitron',monospace;letter-spacing:8px;text-transform:uppercase;text-shadow:0 0 30px rgba(100,255,218,0.5),0 0 80px rgba(100,255,218,0.2);margin-bottom:10px;animation:pulse 2s infinite;">LEARN TF</h1>
    <div style="font-size:0.65em;color:rgba(100,255,218,0.3);font-family:'Orbitron',monospace;letter-spacing:4px;margin-bottom:30px;">v2.0 // SEC 2 MATHEMATICS</div>
    <div style="width:280px;height:2px;background:rgba(100,255,218,0.08);border-radius:2px;overflow:hidden;margin-bottom:15px;position:relative;">
      <div id="loadBar" style="width:0%;height:100%;background:linear-gradient(90deg,#64ffda,#00bfa5);transition:width 1.5s;box-shadow:0 0 15px rgba(100,255,218,0.5);"></div>
    </div>
    <div style="font-size:0.7em;color:rgba(100,255,218,0.3);font-family:'Orbitron',monospace;letter-spacing:2px;margin-bottom:25px;" id="loadStatus">LOADING MODULES...</div>
    <div id="loadTip" style="color:rgba(200,200,200,0.6);font-size:1.05em;max-width:480px;text-align:center;padding:0 20px;font-family:'Rajdhani',sans-serif;font-weight:500;letter-spacing:0.5px;line-height:1.5;animation:pulse 2s infinite;"></div>
  </div>
  <style>
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  </style>
  <script>
    // Particle animation
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = [];
    for(let i=0;i<50;i++){
      particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.5});
    }
    function animateParticles(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
        if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle='rgba(100,255,218,0.15)';ctx.fill();
      });
      // Draw connections
      particles.forEach((a,i)=>{particles.slice(i+1).forEach(b=>{
        const d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(100,255,218,${0.03*(1-d/120)})`;ctx.stroke();}
      });});
      if(document.getElementById('loadingScreen').style.display!=='none')requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</div>

<button onclick="retryWrong()" id="retryBtn" style="display:none;background:rgba(10,30,60,0.8);color:#f0c040;border:1px solid #f0c040;padding:12px 40px;border-radius:10px;cursor:pointer;font-size:1em;font-weight:bold;margin:10px auto;font-family:'Orbitron',monospace;letter-spacing:2px;text-transform:uppercase;transition:all 0.3s;">RETRY INCORRECT</button>
<div id="score" style="text-align:center;font-size:1.5em;margin:20px 0;color:#64ffda;font-family:'Orbitron',monospace;"></div>
<div id="prevScore" style="text-align:center;font-size:0.9em;color:#888;font-family:'Rajdhani',sans-serif;margin-bottom:20px;"></div>
</div>
</div>

// Auto-convert ^0-9 to superscript characters
const superscriptMap = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
document.addEventListener('input', function(e) {
  if (e.target.tagName === 'INPUT' && e.target.id && e.target.id.startsWith('ans')) {
    let val = e.target.value;
    val = val.replace(/\^([0-9])/g, function(match, digit) {
      return superscriptMap[digit] || match;
    });
    if (val !== e.target.value) {
      e.target.value = val;
    }
  }
  if (e.target.tagName === 'TEXTAREA' && e.target.id && e.target.id.startsWith('work')) {
    let val = e.target.value;
    val = val.replace(/\^([0-9])/g, function(match, digit) {
      return superscriptMap[digit] || match;
    });
    if (val !== e.target.value) {
      const pos = e.target.selectionStart;
      e.target.value = val;
      e.target.selectionStart = e.target.selectionEnd = pos - 1;
    }
  }
});

function normalize(s) {
  return s.toLowerCase()
    .replace(/\s+/g,'')
    .replace(/\*/g,'')
    .replace(/×/g,'')
    .replace(/⁰/g,'^0')
    .replace(/¹/g,'^1')
    .replace(/²/g,'^2')
    .replace(/³/g,'^3')
    .replace(/⁴/g,'^4')
    .replace(/⁵/g,'^5')
    .replace(/⁶/g,'^6')
    .replace(/⁷/g,'^7')
    .replace(/⁸/g,'^8')
    .replace(/⁹/g,'^9')
    .replace(/√/g,'sqrt')
    .replace(/÷/g,'/')
    .replace(/km\/hr/g,'km/h')
    .replace(/kmh/g,'km/h')
    .replace(/m\/s\^2/g,'m/s^2')
    .replace(/ms\^2/g,'m/s^2')
    .replace(/cm2/g,'cm^2')
    .replace(/km2/g,'km^2')
    .replace(/m2(?!\/)/g,'m^2')
    .replace(/cm3/g,'cm^3')
    .replace(/m3/g,'m^3')
    .replace(/\$/g,'');
}

function checkAll() {
  let correct = 0;
  const items = quizzes[currentQuiz];
  items.forEach((item, i) => {
    const input = document.getElementById('ans'+i).value.trim();
    const fb = document.getElementById('fb'+i);
    const qDiv = document.getElementById('q'+i);
    fb.style.display = 'block';
    const normInput = normalize(input);
    const isCorrect = item.accepts.some(a => normalize(a) === normInput);
    if (isCorrect) {
      correct++;
      fb.style.background = 'rgba(10,60,40,0.8)';
      fb.style.border = '1px solid #64ffda';
      fb.innerHTML = '✓ Correct!';
      qDiv.style.borderColor = '#64ffda';
      qDiv.dataset.correct = 'true';
    } else {
      // Easter eggs
      const inputLower = input.toLowerCase().replace(/\s+/g,'');
      if (input.endsWith('?')) {
        fb.style.background = 'rgba(40,40,0,0.8)';
        fb.style.border = '1px solid #f0c040';
        fb.innerHTML = '❓ Why the LearnTF u asking me? I\'m not Google.';
        qDiv.style.borderColor = '#f0c040';
        qDiv.dataset.correct = 'false';
      } else if (inputLower === 'bread>key' || inputLower === 'bread>keys') {
        fb.style.background = 'rgba(60,40,0,0.8)';
        fb.style.border = '1px solid #f0c040';
        fb.innerHTML = '🍞 <b>EASTER EGG!</b> Bread does indeed taste better than key. But that\'s not the answer...';
        qDiv.style.borderColor = '#f0c040';
        qDiv.dataset.correct = 'false';
      } else if (inputLower === 'amoldesai' || inputLower === 'amol desai' || inputLower === 'amol') {
        fb.style.background = 'rgba(60,0,60,0.8)';
        fb.style.border = '1px solid #ff64ff';
        fb.innerHTML = '👑 <b>EASTER EGG!</b> The legend himself. But he didn\'t say that was the answer...';
        qDiv.style.borderColor = '#ff64ff';
        qDiv.dataset.correct = 'false';
      } else if (inputLower === '67' || inputLower === 'sixty seven') {
        fb.style.background = 'rgba(0,30,60,0.8)';
        fb.style.border = '1px solid #6496ff';
        fb.innerHTML = '🎯 <b>EASTER EGG!</b> 67. You know what that means. But try the actual answer...';
        qDiv.style.borderColor = '#6496ff';
        qDiv.dataset.correct = 'false';
      } else {
        fb.style.background = 'rgba(60,10,10,0.8)';
        fb.style.border = '1px solid #ff6464';
        fb.innerHTML = `✗ Incorrect.<br><strong>Your answer:</strong> ${input || '(blank)'}<br><strong>Correct answer:</strong> ${item.answer}<br><br><strong>💡 Hint:</strong> ${item.hint}<br><br><strong>📝 Explanation:</strong> ${item.explanation}`;
        qDiv.style.borderColor = '#ff6464';
        qDiv.dataset.correct = 'false';
      }
    }
  });
  const scoreText = correct + '/' + items.length;
  document.getElementById('score').textContent = 'Score: ' + scoreText;
  // Save best score
  const prev = localStorage.getItem('score_' + currentQuiz);
  const prevNum = prev ? parseInt(prev.split('/')[0]) : 0;
  if (correct >= prevNum) {
    localStorage.setItem('score_' + currentQuiz, scoreText);
  }
  document.getElementById('prevScore').textContent = '📊 Best: ' + (localStorage.getItem('score_' + currentQuiz));
  // Show retry button if any wrong
  if (correct < items.length) {
    document.getElementById('retryBtn').style.display = 'block';
  }
}

function retryWrong() {
  const items = quizzes[currentQuiz];
  items.forEach((item, i) => {
    const qDiv = document.getElementById('q'+i);
    if (qDiv.dataset.correct === 'true') {
      qDiv.style.display = 'none';
    } else {
      // Clear feedback and answer for retry
      document.getElementById('fb'+i).style.display = 'none';
      document.getElementById('ans'+i).value = '';
      qDiv.style.borderColor = 'rgba(100,255,218,0.08)';
    }
  });
  document.getElementById('score').textContent = '';
  document.getElementById('retryBtn').style.display = 'none';
}

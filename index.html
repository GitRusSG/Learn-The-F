<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 30px; color: #64ffda; font-size: 2em; }
.quiz-select { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; max-height: 70vh; overflow-y: auto; padding: 10px; }
.folder { margin-bottom: 20px; }
.folder-title { color: #64ffda; font-size: 1.3em; margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #0f3460; cursor: pointer; }
.folder-title:hover { background: #0f3460; border-radius: 8px; }
.folder-content { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding-left: 10px; }
.folder-content.open { display: grid; }
.quiz-btn { padding: 20px; background: #16213e; border: 2px solid #0f3460; border-radius: 12px; cursor: pointer; transition: all 0.3s; color: #eee; font-size: 1em; text-align: left; }
.quiz-btn:hover { border-color: #64ffda; transform: translateY(-2px); }
.unit-btn { background:#0f3460;color:#aaa;border:1px solid #1a3a5c;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:0.8em; }
.unit-btn:hover { color:#64ffda;border-color:#64ffda; }
.quiz-btn.active { border-color: #64ffda; background: #0f3460; }
.quiz-area { display: none; }
.quiz-area.show { display: block; }
.question { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #0f3460; }
.question h3 { color: #64ffda; margin-bottom: 12px; font-size: 1.1em; }
.question .prompt { font-size: 1.2em; margin-bottom: 15px; font-family: 'Courier New', monospace; }
</style>

// Merge new quizzes into main object
Object.assign(quizzes, newQuizzes);

let currentQuiz = null;

function init() {
  const sel = document.getElementById('quizSelect');
  // Define folders
  const folders = {
    "Unit 3: Algebraic Expressions": [],
    "Unit 4: Quadratic Equations & Graphs": [],
    "Unit 5: Scales & Maps": [],
    "Unit 6: Direct & Inverse Proportion": [],
    "Unit 7: Rate & Speed": []
  };
  // Sort quizzes into folders
  Object.keys(quizzes).forEach(name => {
    if (name.includes("Unit 3")) folders["Unit 3: Algebraic Expressions"].push(name);
    else if (name.includes("Unit 4") || name.includes("4.")) folders["Unit 4: Quadratic Equations & Graphs"].push(name);
    else if (name.includes("Unit 5")) folders["Unit 5: Scales & Maps"].push(name);
    else if (name.includes("Unit 6")) folders["Unit 6: Direct & Inverse Proportion"].push(name);
    else if (name.includes("Unit 7")) folders["Unit 7: Rate & Speed"].push(name);
    else folders["Unit 3: Algebraic Expressions"].push(name); // fallback
  });
  // Render folders
  Object.entries(folders).forEach(([folderName, items]) => {
    if (items.length === 0) return;
    const folder = document.createElement('div');
    folder.className = 'folder';
    const title = document.createElement('div');
    title.className = 'folder-title';
    title.textContent = '📁 ' + folderName + ' (' + items.length + ' quizzes)';
    title.onclick = () => {
      const content = title.nextElementSibling;
      content.classList.toggle('open');
    };
    folder.appendChild(title);
    const content = document.createElement('div');
    content.className = 'folder-content';
    items.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'quiz-btn';
      btn.textContent = name;
      btn.onclick = () => loadQuiz(name);
      content.appendChild(btn);
    });
    folder.appendChild(content);
    sel.appendChild(folder);
  });
}

function loadQuiz(name) {
  currentQuiz = name;
  document.getElementById('quizSelect').style.display = 'none';
  document.getElementById('quizArea').classList.add('show');
  document.getElementById('quizTitle').textContent = name;
  document.getElementById('score').textContent = '';
  const container = document.getElementById('questions');
  container.innerHTML = '';
  quizzes[name].forEach((item, i) => {
    container.innerHTML += `
      <div class="question" id="q${i}">
        <h3>Question ${i+1}</h3>
        <div class="prompt">${item.q}</div>
        <textarea id="work${i}" placeholder="Working space (scratch work here)..."
          style="width:100%;padding:12px;font-size:0.95em;border-radius:8px;border:1px solid #0f3460;background:#0d1b2a;color:#aaa;font-family:'Courier New',monospace;min-height:80px;resize:vertical;margin-bottom:10px;"></textarea>
        <input type="text" id="ans${i}" placeholder="Final answer..."
          style="width:100%;padding:12px;font-size:1.1em;border-radius:8px;border:2px solid #0f3460;background:#0d1b2a;color:#eee;font-family:'Courier New',monospace;">
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;">
          <button class="unit-btn" onclick="insertUnit(${i},'km/h')">km/h</button>
          <button class="unit-btn" onclick="insertUnit(${i},'m/s')">m/s</button>
          <button class="unit-btn" onclick="insertUnit(${i},'m/s²')">m/s²</button>
          <button class="unit-btn" onclick="insertUnit(${i},'cm²')">cm²</button>
          <button class="unit-btn" onclick="insertUnit(${i},'km²')">km²</button>
          <button class="unit-btn" onclick="insertUnit(${i},'m²')">m²</button>
          <button class="unit-btn" onclick="insertUnit(${i},'cm³')">cm³</button>
          <button class="unit-btn" onclick="insertUnit(${i},'²')">²</button>
          <button class="unit-btn" onclick="insertUnit(${i},'³')">³</button>
          <button class="unit-btn" onclick="insertUnit(${i},'√')">√</button>
          <button class="unit-btn" onclick="insertUnit(${i},'±')">±</button>
        </div>
        <button onclick="showHint(${i})" style="margin-top:10px;background:none;border:1px solid #f0c040;color:#f0c040;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:0.9em;">💡 Hint</button>
        <div id="hint${i}" style="margin-top:8px;display:none;padding:10px;border-radius:8px;background:#2a2a00;border:1px solid #f0c040;color:#f0c040;font-size:0.95em;"></div>
        <div id="fb${i}" style="margin-top:12px;display:none;padding:12px;border-radius:8px;"></div>
      </div>`;
  });
}

function goHome() {
  document.getElementById('quizSelect').style.display = 'grid';
  document.getElementById('quizArea').classList.remove('show');
}

function showHint(i) {
  const items = quizzes[currentQuiz];
  const hintDiv = document.getElementById('hint'+i);
  hintDiv.style.display = hintDiv.style.display === 'none' ? 'block' : 'none';
  hintDiv.textContent = items[i].hint;
}

function insertUnit(i, unit) {
  const input = document.getElementById('ans'+i);
  input.value += unit;
  input.focus();
}

// Auto-convert ^0-9 to superscript characters
const superscriptMap = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
document.addEventListener('input', function(e) {
  if (e.target.tagName === 'INPUT' && e.target.id && e.target.id.startsWith('ans')) {
    let val = e.target.value;
    // Replace ^N with superscript
    val = val.replace(/\^([0-9])/g, function(match, digit) {
      return superscriptMap[digit] || match;
    });
    if (val !== e.target.value) {
      e.target.value = val;
    }
  }
});

function normalize(s) {
  return s.toLowerCase()
    .replace(/\s+/g,'')
    .replace(/\*/g,'')
    .replace(/×/g,'')
    .replace(/⁰/g,'^0')
    .replace(/¹/g,'^1')
    .replace(/²/g,'^2')
    .replace(/³/g,'^3')
    .replace(/⁴/g,'^4')
    .replace(/⁵/g,'^5')
    .replace(/⁶/g,'^6')
    .replace(/⁷/g,'^7')
    .replace(/⁸/g,'^8')
    .replace(/⁹/g,'^9')
    .replace(/√/g,'sqrt')
    .replace(/÷/g,'/')
    .replace(/km\/hr/g,'km/h')
    .replace(/kmh/g,'km/h')
    .replace(/m\/s\^2/g,'m/s^2')
    .replace(/ms\^2/g,'m/s^2')
    .replace(/cm2/g,'cm^2')
    .replace(/km2/g,'km^2')
    .replace(/m2(?!\/)/g,'m^2')
    .replace(/cm3/g,'cm^3')
    .replace(/m3/g,'m^3')
    .replace(/\$/g,'');
}

function checkAll() {
  let correct = 0;
  const items = quizzes[currentQuiz];
  items.forEach((item, i) => {
    const input = document.getElementById('ans'+i).value.trim();
    const fb = document.getElementById('fb'+i);
    const qDiv = document.getElementById('q'+i);
    fb.style.display = 'block';
    const normInput = normalize(input);
    const isCorrect = item.accepts.some(a => normalize(a) === normInput);
    if (isCorrect) {
      correct++;
      fb.style.background = '#0a3d2a';
      fb.style.border = '1px solid #64ffda';
      fb.innerHTML = '✓ Correct!';
      qDiv.style.borderColor = '#64ffda';
    } else {
      fb.style.background = '#3d0a0a';
      fb.style.border = '1px solid #ff6464';
      fb.innerHTML = `✗ Incorrect.<br><strong>Your answer:</strong> ${input || '(blank)'}<br><strong>Correct answer:</strong> ${item.answer}<br><br><strong>💡 Hint:</strong> ${item.hint}<br><br><strong>📝 Explanation:</strong> ${item.explanation}`;
      qDiv.style.borderColor = '#ff6464';
    }
  });
  document.getElementById('score').textContent = `Score: ${correct}/${items.length}`;
}
